name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "meridian-platform/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "meridian-platform/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: meridian_test
          POSTGRES_USER: meridian_test
          POSTGRES_PASSWORD: meridian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian_test -d meridian_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: meridian-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: meridian-platform/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/meridian_test
          SPRING_DATASOURCE_USERNAME: meridian_test
          SPRING_DATASOURCE_PASSWORD: meridian_test
        run: ./mvnw -B verify

      - name: Build application container
        run: docker build --tag meridian-platform:ci .
