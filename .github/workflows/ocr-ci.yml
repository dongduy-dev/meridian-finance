name: OCR CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "ocr-service/**"
      - "meridian-platform/src/main/resources/db/migration/V58__add_ocr_processing_foundation.sql"
      - ".github/workflows/ocr-ci.yml"

jobs:
  detect-ocr-changes:
    runs-on: ubuntu-latest
    outputs:
      ocr-changed: ${{ steps.changes.outputs.ocr-changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect OCR-relevant changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "ocr-changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- ocr-service \
               meridian-platform/src/main/resources/db/migration/V58__add_ocr_processing_foundation.sql \
               .github/workflows/ocr-ci.yml; then
            echo "ocr-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "ocr-changed=true" >> "$GITHUB_OUTPUT"
          fi

  ocr-verify:
    needs: detect-ocr-changes
    if: needs.detect-ocr-changes.outputs.ocr-changed == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: meridian_ocr_test
          POSTGRES_USER: meridian_ocr_test
          POSTGRES_PASSWORD: meridian_ocr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian_ocr_test -d meridian_ocr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ocr-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ocr-service/requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --no-build-isolation --no-deps .

      - name: Test OCR service
        env:
          OCR_TEST_DATABASE_URL: postgresql://meridian_ocr_test:meridian_ocr_test@localhost:5432/meridian_ocr_test
        run: python -m pytest

      - name: Build OCR service container
        run: docker build --tag meridian-ocr-service:ci .

  ocr-test:
    needs:
      - detect-ocr-changes
      - ocr-verify
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Report required OCR gate
        shell: bash
        env:
          OCR_CHANGED: ${{ needs.detect-ocr-changes.outputs.ocr-changed }}
          DETECTION_RESULT: ${{ needs.detect-ocr-changes.result }}
          VERIFICATION_RESULT: ${{ needs.ocr-verify.result }}
        run: |
          if [[ "$DETECTION_RESULT" != "success" ]]; then
            echo "OCR change detection did not succeed."
            exit 1
          fi
          if [[ "$OCR_CHANGED" == "false" ]]; then
            echo "No OCR-relevant changes detected; OCR verification was not required."
            exit 0
          fi
          if [[ "$OCR_CHANGED" != "true" ]]; then
            echo "OCR change detection did not produce a valid result."
            exit 1
          fi
          if [[ "$VERIFICATION_RESULT" == "success" ]]; then
            echo "OCR verification succeeded."
            exit 0
          fi
          echo "OCR verification result: $VERIFICATION_RESULT"
          exit 1
