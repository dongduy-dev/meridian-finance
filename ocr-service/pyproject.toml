[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-ocr-service"
version = "0.1.0"
description = "Purpose-limited Meridian OCR queue worker and health service"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    "google-cloud-documentai==3.15.0",
    "psycopg[binary,pool]==3.3.5",
    "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
