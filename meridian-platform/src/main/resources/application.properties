spring.application.name=meridian-platform
spring.main.banner-mode=off

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meridian_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:meridian_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.modulith.events.republish-outstanding-events-on-restart=${MERIDIAN_EVENT_REPUBLICATION_ON_RESTART_ENABLED:true}

meridian.customer.encryption-key=${MERIDIAN_CUSTOMER_ENCRYPTION_KEY:}
meridian.customer.fingerprint-key=${MERIDIAN_CUSTOMER_FINGERPRINT_KEY:}
meridian.document.storage-root=${MERIDIAN_DOCUMENT_STORAGE_ROOT:${java.io.tmpdir}/meridian-documents}
meridian.web.cors.allowed-origins=${MERIDIAN_FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}
meridian.identity.refresh-token.lifetime=${MERIDIAN_REFRESH_TOKEN_LIFETIME:7d}
meridian.identity.refresh-token.cookie-secure=${MERIDIAN_REFRESH_TOKEN_COOKIE_SECURE:false}
meridian.identity.account-lockout.max-failed-attempts=${MERIDIAN_ACCOUNT_LOCKOUT_MAX_FAILED_ATTEMPTS:5}
meridian.identity.account-lockout.lock-duration=${MERIDIAN_ACCOUNT_LOCKOUT_DURATION:15m}
meridian.identity.rate-limit.login.max-requests=${MERIDIAN_LOGIN_RATE_LIMIT_MAX_REQUESTS:10}
meridian.identity.rate-limit.login.window=${MERIDIAN_LOGIN_RATE_LIMIT_WINDOW:1m}
meridian.identity.rate-limit.refresh.max-requests=${MERIDIAN_REFRESH_RATE_LIMIT_MAX_REQUESTS:30}
meridian.identity.rate-limit.refresh.window=${MERIDIAN_REFRESH_RATE_LIMIT_WINDOW:1m}
meridian.identity.rate-limit.registration.max-requests=${MERIDIAN_REGISTRATION_RATE_LIMIT_MAX_REQUESTS:5}
meridian.identity.rate-limit.registration.window=${MERIDIAN_REGISTRATION_RATE_LIMIT_WINDOW:10m}
meridian.identity.rate-limit.email-verification-request.max-requests=${MERIDIAN_EMAIL_VERIFICATION_REQUEST_RATE_LIMIT_MAX_REQUESTS:5}
meridian.identity.rate-limit.email-verification-request.window=${MERIDIAN_EMAIL_VERIFICATION_REQUEST_RATE_LIMIT_WINDOW:10m}
meridian.identity.email-verification.lifetime=${MERIDIAN_EMAIL_VERIFICATION_LIFETIME:24h}
meridian.identity.password-reset.lifetime=${MERIDIAN_PASSWORD_RESET_LIFETIME:30m}
meridian.identity.rate-limit.password-reset-request.max-requests=${MERIDIAN_PASSWORD_RESET_REQUEST_RATE_LIMIT_MAX_REQUESTS:5}
meridian.identity.rate-limit.password-reset-request.window=${MERIDIAN_PASSWORD_RESET_REQUEST_RATE_LIMIT_WINDOW:10m}
meridian.identity.jwt.private-key=${MERIDIAN_JWT_PRIVATE_KEY:}
meridian.identity.jwt.public-key=${MERIDIAN_JWT_PUBLIC_KEY:}

meridian.frontend.base-url=${MERIDIAN_FRONTEND_BASE_URL:http://localhost:5173}
meridian.notification.from-address=${MERIDIAN_NOTIFICATION_FROM_ADDRESS:no-reply@meridian.local}
meridian.notification.smtp.host=${MERIDIAN_SMTP_HOST:localhost}
meridian.notification.smtp.port=${MERIDIAN_SMTP_PORT:1025}
meridian.notification.smtp.username=${MERIDIAN_SMTP_USERNAME:}
meridian.notification.smtp.password=${MERIDIAN_SMTP_PASSWORD:}
meridian.notification.smtp.authentication-enabled=${MERIDIAN_SMTP_AUTH:false}
meridian.notification.smtp.start-tls-enabled=${MERIDIAN_SMTP_STARTTLS:false}

server.port=8080
logging.structured.format.console=logstash
logging.level.org.springframework.security=INFO
meridian.loan.offer-expiry.enabled=true
meridian.loan.offer-expiry.fixed-delay-ms=60000
meridian.loan.offer-expiry.batch-size=100
meridian.loan.overdue-evaluation.enabled=false
meridian.loan.overdue-evaluation.cron=0 5 0 * * *
meridian.loan.overdue-evaluation.batch-size=100
meridian.loan.disbursement-snapshot.active-key-id=${MERIDIAN_LOAN_DISBURSEMENT_SNAPSHOT_ACTIVE_KEY_ID:}
meridian.loan.disbursement-snapshot.keys.local=${MERIDIAN_LOAN_DISBURSEMENT_SNAPSHOT_KEYS_LOCAL:}
