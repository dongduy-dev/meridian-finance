spring.application.name=meridian-platform

spring.datasource.url=jdbc:postgresql://localhost:5432/meridian_db
spring.datasource.username=meridian_user
spring.datasource.password=meridian156
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080
logging.level.org.springframework.security=DEBUG
meridian.loan.offer-expiry.enabled=true
meridian.loan.offer-expiry.fixed-delay-ms=60000
meridian.loan.offer-expiry.batch-size=100
meridian.loan.overdue-evaluation.enabled=false
meridian.loan.overdue-evaluation.cron=0 5 0 * * *
meridian.loan.overdue-evaluation.batch-size=100
meridian.loan.disbursement-snapshot.active-key-id=${MERIDIAN_LOAN_DISBURSEMENT_SNAPSHOT_ACTIVE_KEY_ID:}
