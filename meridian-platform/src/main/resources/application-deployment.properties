# Fixed public portfolio contract; credentials remain external.
meridian.notification.smtp.production=true
meridian.notification.smtp.host=smtp.resend.com
meridian.notification.smtp.port=587
meridian.notification.smtp.username=resend
meridian.notification.smtp.authentication-enabled=true
meridian.notification.smtp.start-tls-enabled=true
meridian.notification.smtp.start-tls-required=true
meridian.notification.from-address=notifications@meridianfinance.dev
meridian.frontend.base-url=https://meridianfinance.dev
meridian.internal-frontend.base-url=https://internal.meridianfinance.dev
spring.datasource.hikari.connection-timeout=2000
management.server.address=127.0.0.1
management.server.port=9090
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,database,documentStorage
management.endpoint.health.probes.add-additional-paths=false
