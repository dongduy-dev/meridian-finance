services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meridian_db}
      POSTGRES_USER: ${POSTGRES_USER:-meridian_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in meridian-platform/.env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - meridian_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  meridian-platform:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-meridian_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-meridian_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in meridian-platform/.env}
      MERIDIAN_CUSTOMER_ENCRYPTION_KEY: ${MERIDIAN_CUSTOMER_ENCRYPTION_KEY:?Set MERIDIAN_CUSTOMER_ENCRYPTION_KEY in meridian-platform/.env}
      MERIDIAN_CUSTOMER_FINGERPRINT_KEY: ${MERIDIAN_CUSTOMER_FINGERPRINT_KEY:?Set MERIDIAN_CUSTOMER_FINGERPRINT_KEY in meridian-platform/.env}
      MERIDIAN_LOAN_DISBURSEMENT_SNAPSHOT_ACTIVE_KEY_ID: ${MERIDIAN_LOAN_DISBURSEMENT_SNAPSHOT_ACTIVE_KEY_ID:-local}
      MERIDIAN_LOAN_DISBURSEMENT_SNAPSHOT_KEYS_LOCAL: ${MERIDIAN_LOAN_DISBURSEMENT_SNAPSHOT_KEYS_LOCAL:?Set MERIDIAN_LOAN_DISBURSEMENT_SNAPSHOT_KEYS_LOCAL in meridian-platform/.env}
      MERIDIAN_DOCUMENT_STORAGE_ROOT: ${MERIDIAN_DOCUMENT_STORAGE_ROOT:-/var/lib/meridian/documents}
      MERIDIAN_FRONTEND_ALLOWED_ORIGINS: ${MERIDIAN_FRONTEND_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      MERIDIAN_FRONTEND_BASE_URL: ${MERIDIAN_FRONTEND_BASE_URL:-http://localhost:5173}
      MERIDIAN_ACCOUNT_LOCKOUT_MAX_FAILED_ATTEMPTS: ${MERIDIAN_ACCOUNT_LOCKOUT_MAX_FAILED_ATTEMPTS:-5}
      MERIDIAN_ACCOUNT_LOCKOUT_DURATION: ${MERIDIAN_ACCOUNT_LOCKOUT_DURATION:-15m}
      MERIDIAN_LOGIN_RATE_LIMIT_MAX_REQUESTS: ${MERIDIAN_LOGIN_RATE_LIMIT_MAX_REQUESTS:-10}
      MERIDIAN_LOGIN_RATE_LIMIT_WINDOW: ${MERIDIAN_LOGIN_RATE_LIMIT_WINDOW:-1m}
      MERIDIAN_REFRESH_RATE_LIMIT_MAX_REQUESTS: ${MERIDIAN_REFRESH_RATE_LIMIT_MAX_REQUESTS:-30}
      MERIDIAN_REFRESH_RATE_LIMIT_WINDOW: ${MERIDIAN_REFRESH_RATE_LIMIT_WINDOW:-1m}
      MERIDIAN_REGISTRATION_RATE_LIMIT_MAX_REQUESTS: ${MERIDIAN_REGISTRATION_RATE_LIMIT_MAX_REQUESTS:-5}
      MERIDIAN_REGISTRATION_RATE_LIMIT_WINDOW: ${MERIDIAN_REGISTRATION_RATE_LIMIT_WINDOW:-10m}
      MERIDIAN_EMAIL_VERIFICATION_REQUEST_RATE_LIMIT_MAX_REQUESTS: ${MERIDIAN_EMAIL_VERIFICATION_REQUEST_RATE_LIMIT_MAX_REQUESTS:-5}
      MERIDIAN_EMAIL_VERIFICATION_REQUEST_RATE_LIMIT_WINDOW: ${MERIDIAN_EMAIL_VERIFICATION_REQUEST_RATE_LIMIT_WINDOW:-10m}
      MERIDIAN_EMAIL_VERIFICATION_LIFETIME: ${MERIDIAN_EMAIL_VERIFICATION_LIFETIME:-24h}
      MERIDIAN_PASSWORD_RESET_LIFETIME: ${MERIDIAN_PASSWORD_RESET_LIFETIME:-30m}
      MERIDIAN_PASSWORD_RESET_REQUEST_RATE_LIMIT_MAX_REQUESTS: ${MERIDIAN_PASSWORD_RESET_REQUEST_RATE_LIMIT_MAX_REQUESTS:-5}
      MERIDIAN_PASSWORD_RESET_REQUEST_RATE_LIMIT_WINDOW: ${MERIDIAN_PASSWORD_RESET_REQUEST_RATE_LIMIT_WINDOW:-10m}
      MERIDIAN_REFRESH_TOKEN_LIFETIME: ${MERIDIAN_REFRESH_TOKEN_LIFETIME:-7d}
      MERIDIAN_REFRESH_TOKEN_COOKIE_SECURE: ${MERIDIAN_REFRESH_TOKEN_COOKIE_SECURE:-false}
      MERIDIAN_JWT_PRIVATE_KEY: ${MERIDIAN_JWT_PRIVATE_KEY:?Set MERIDIAN_JWT_PRIVATE_KEY in meridian-platform/.env}
      MERIDIAN_JWT_PUBLIC_KEY: ${MERIDIAN_JWT_PUBLIC_KEY:?Set MERIDIAN_JWT_PUBLIC_KEY in meridian-platform/.env}
      MERIDIAN_SMTP_HOST: ${MERIDIAN_SMTP_HOST:-mailpit}
      MERIDIAN_SMTP_PORT: ${MERIDIAN_SMTP_PORT:-1025}
      MERIDIAN_SMTP_USERNAME: ${MERIDIAN_SMTP_USERNAME:-}
      MERIDIAN_SMTP_PASSWORD: ${MERIDIAN_SMTP_PASSWORD:-}
      MERIDIAN_SMTP_AUTH: ${MERIDIAN_SMTP_AUTH:-false}
      MERIDIAN_SMTP_STARTTLS: ${MERIDIAN_SMTP_STARTTLS:-false}
      MERIDIAN_NOTIFICATION_FROM_ADDRESS: ${MERIDIAN_NOTIFICATION_FROM_ADDRESS:-no-reply@meridian.local}
    ports:
      - "${MERIDIAN_PORT:-8080}:8080"
    volumes:
      - meridian_document_data:${MERIDIAN_DOCUMENT_STORAGE_ROOT:-/var/lib/meridian/documents}

  ocr-service:
    profiles: ["ocr"]
    build:
      context: ../ocr-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OCR_DATABASE_URL: postgresql://${POSTGRES_USER:-meridian_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-meridian_db}
      MERIDIAN_DOCUMENT_STORAGE_ROOT: ${MERIDIAN_DOCUMENT_STORAGE_ROOT:-/var/lib/meridian/documents}
      MERIDIAN_OCR_RESULT_ENCRYPTION_KEY: ${MERIDIAN_OCR_RESULT_ENCRYPTION_KEY:-}
      MERIDIAN_OCR_WORKER_ID: ${MERIDIAN_OCR_WORKER_ID:-ocr-worker-local}
      MERIDIAN_OCR_LEASE_SECONDS: ${MERIDIAN_OCR_LEASE_SECONDS:-120}
      MERIDIAN_OCR_MAX_ATTEMPTS: ${MERIDIAN_OCR_MAX_ATTEMPTS:-3}
      MERIDIAN_OCR_INITIAL_BACKOFF_SECONDS: ${MERIDIAN_OCR_INITIAL_BACKOFF_SECONDS:-15}
      MERIDIAN_OCR_POLLING_INTERVAL_SECONDS: ${MERIDIAN_OCR_POLLING_INTERVAL_SECONDS:-2}
      MERIDIAN_OCR_CONFIDENCE_THRESHOLD: ${MERIDIAN_OCR_CONFIDENCE_THRESHOLD:-0.85}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_DOCUMENT_AI_LOCATION: ${GOOGLE_DOCUMENT_AI_LOCATION:-}
      GOOGLE_DOCUMENT_AI_PROCESSOR_ID: ${GOOGLE_DOCUMENT_AI_PROCESSOR_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    ports:
      - "${MERIDIAN_OCR_PORT:-8090}:8090"
    volumes:
      - meridian_document_data:${MERIDIAN_DOCUMENT_STORAGE_ROOT:-/var/lib/meridian/documents}:ro

volumes:
  meridian_postgres_data:
  meridian_document_data:
